name: Deploy

# Builds and pushes production images to GHCR on every merge to main.
# A tag push (v*) additionally triggers the staging smoke test.
#
# Targets a single container host by design (see CLAUDE.md: no K8s).
# To deploy to a VM, add a job that ssh'es in and runs:
#   docker compose pull && docker compose up -d

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}-backend
            ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.ref_name }},${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.ref_name }},${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test (staging)
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack with the pushed images
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lexbook
          JWT_SECRET=smoke-test-secret-not-for-prod
          EMBEDDING_PROVIDER=fastembed
          ENVIRONMENT=staging
          EOF
          # Override the built images into compose
          sed -i "s|build:|image: ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}\n      build:|" docker-compose.yml 2>/dev/null || true
          docker compose up -d db backend || docker-compose up -d db backend

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health/ready > /dev/null 2>&1; then
              echo "Ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"; docker logs lexbook-backend 2>&1 | tail -30; exit 1

      - name: Smoke: liveness, auth, error envelope
        run: |
          set -e
          curl -sf http://localhost:8000/api/v1/health/live | grep -q alive
          # Unauthenticated business route must 401 with our envelope
          RESP=$(curl -s http://localhost:8000/api/v1/study-sessions)
          echo "$RESP" | grep -q unauthorized
          # Guest login must succeed
          curl -sf -X POST http://localhost:8000/api/v1/auth/guest > /dev/null
          echo "Smoke test passed"

  deploy-staging:
    name: Deploy to staging host
    runs-on: ubuntu-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - name: Placeholder deploy step
        run: |
          echo "Images pushed and smoke-tested."
          echo "Wire this step to your VM: ssh + 'docker compose pull && docker compose up -d'"
          echo "Skipping actual deploy — no host configured yet."