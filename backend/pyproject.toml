[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbook-backend"
version = "0.1.0"
description = "Backend for LexBook AI - learning platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pymupdf",
    "pgvector",
    "fastembed",
    "langchain-text-splitters",
    "httpx",
    "python-multipart",
    "langgraph",
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.0",
    "pydantic[email]>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# FastaAPI uses Depends()/File() in parameter defaults by design; async
# file ops are acceptable in this local-only backend for V1–V3.
ignore = [
    "B008",   # function call in default arguments (FastAPI Depends/File)
    "ASYNC240", "ASYNC230",  # async file/pathlib (acceptable for local uploads)
    "ASYNC110",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"